# shop.civired.com — tienda WooCommerce + servicio de sincronización con proveedores
# nginx (ISPConfig, hosting06) -> 127.0.0.1:3020 -> wordpress
services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: shop
      MARIADB_USER: shop
      MARIADB_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?falta DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      retries: 10

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    ports:
      - "127.0.0.1:${SHOP_PORT:-3020}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: shop
      WORDPRESS_DB_USER: shop
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'https://${SHOP_DOMAIN:-shop.civired.com}');
        define('WP_SITEURL', 'https://${SHOP_DOMAIN:-shop.civired.com}');
        if (($$_SERVER['HTTP_X_FORWARDED_PROTO'] ?? '') === 'https') { $$_SERVER['HTTPS'] = 'on'; }
        define('DISALLOW_FILE_EDIT', true);
        define('WP_ENVIRONMENT_TYPE', 'production');
        define('WP_MEMORY_LIMIT', '256M');
    volumes:
      - wp_data:/var/www/html
      - ./wp/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
      - ./wp/mu-plugins:/var/www/html/wp-content/mu-plugins:ro

  # Herramienta de línea de comandos de WordPress (solo para instalar/configurar: docker compose run --rm wpcli ...)
  wpcli:
    image: wordpress:cli-php8.3
    profiles: ["tools"]
    user: "33:33"
    depends_on: [wordpress]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: shop
      WORDPRESS_DB_USER: shop
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      HOME: /tmp
    volumes:
      - wp_data:/var/www/html
      - ./wp/mu-plugins:/var/www/html/wp-content/mu-plugins:ro
      - ./scripts:/scripts:ro

  sync:
    build: ./sync
    restart: unless-stopped
    depends_on: [wordpress]
    env_file: .env
    environment:
      WOO_URL: http://wordpress
      DATA_DIR: /data
    volumes:
      - sync_data:/data

volumes:
  db_data:
  wp_data:
  sync_data:
